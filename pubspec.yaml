name: peek
description: "Peekio - Anonymous photo request app"
publish_to: 'none' # private project

version: 1.0.1+1 # 🚀 NEW VERSION: Created to submit Build 20 with fixes

environment:
  sdk: '>=3.3.0 <4.0.0' # Keep modern range

dependencies:
  flutter:
    sdk: flutter

  # Firebase core tools
  firebase_core: ^3.13.1 # Keep previous update
  firebase_auth: ^5.5.4 # Updated patch
  cloud_firestore: ^5.6.7 # Updated patch
  firebase_storage: ^12.1.0 # Keep previous update
  firebase_messaging: ^15.0.1 # Keep previous update
  firebase_analytics: ^11.0.1 # Keep previous update
  firebase_in_app_messaging: ^0.8.0 # Keep previous update
  firebase_ui_auth: ^1.13.1 # Keep previous update
  cloud_functions: ^5.5.1

  timeago: ^3.6.1
  rive: ^0.13.4 # Keep previous update (Check latest safe minor if desired: ^0.13.x)
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Subscriptions & payments
  in_app_purchase: ^3.2.1 # Keep, check latest safe minor if desired

  # Local storage & UUID
  shared_preferences: ^2.2.3 # Keep previous update
  uuid: ^4.4.0 # Keep previous update
  # --- NOTE: Keep major version locked for now ---
  freezed_annotation: ^2.4.2 # Keep at 2.x

  # Routing & state management
  # --- NOTE: Keep major version locked for now ---
  go_router: ^14.8.1 # Keep at 14.x
  flutter_riverpod: ^2.5.1 # Keep previous update
  # --- NOTE: Keep major version locked for now ---
  flutter_hooks: ^0.20.5 # Keep at 0.20.x
  url_launcher: ^6.3.0 # Keep previous update
  in_app_review: ^2.0.10 # Keep, check latest safe minor if desired

  device_info_plus: ^11.4.0

  flutter_local_notifications: ^19.3.0

  # UI enhancements
  # google_fonts: ^6.2.1 # Keep removed
  flutter_spinkit: ^5.2.1 # Keep previous update
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2815.0

  # Camera / photo
  image_picker: ^1.1.2 # Keep, check latest safe minor if desired
  camera: ^0.11.0 # Keep previous update
  image: ^4.2.0 # Keep previous update
  confetti: ^0.8.0

  lottie: ^3.3.1

  fl_chart: ^0.68.0

  flutter_svg: ^2.1.0
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11 # Keep previous update
  # --- NOTE: Keep major version locked for now ---
  freezed: ^2.5.3 # Keep at 2.x
  # --- NOTE: Keep major version locked for now ---
  flutter_lints: ^4.0.0 # Keep at 4.x
  # --- NOTE: Keep minor version locked for now ---
  flutter_launcher_icons: ^0.13.1 # Keep at 0.13.x
  flutter_native_splash: ^2.4.6

# 🔧 Firebase Dynamic Links removed - deprecated and unused

flutter:
  uses-material-design: true

  assets:
    # Keep asset declarations as before
    - assets/images/
    - assets/animations/
    - assets/animations/lottie/ # Changed from rive

  fonts:
    # Keep font declarations as before
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Launcher icon config as before
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/images/peekio_app.png"
  web:
    generate: true
    image_path: "assets/images/peekio_app.png"
    background_color: "#1A1A1A"
    theme_color: "#6366F1"
  image_path: "assets/images/peekio_app.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/images/peekio_app.png"

# Native splash screen configuration
flutter_native_splash:
  color: "#1A1A1A"  # Match peekBackgroundColor
  image: assets/images/peekio_app.png
  android_12:
    image: assets/images/peekio_app.png
    color: "#1A1A1A"
  web: false
  ios: true