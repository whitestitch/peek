dependencies:
  flutter:
    sdk: flutter

  # Payments
  in_app_purchase: ^3.2.1

  shared_preferences: ^2.2.2

  # Firebase core tools
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
